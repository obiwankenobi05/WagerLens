<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="WagerLens — your betting history, analyzed. A local-only analytics instrument for Stake betting archives."
    />
    <meta name="robots" content="noindex" />
    <title>WagerLens — Your betting history, analyzed.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' fill='none' stroke='%23f5f5f0' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23ff4f00' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // palette. Mirrors resolveInitialTheme() in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('wagerlens.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — keep the markup default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
