<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Upload your Stake betting archives and see where the money went. P&amp;L over time, drawdowns, streaks and per-game breakdowns, parsed entirely in your browser."
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <title>WagerLens | Your betting history, analyzed.</title>

    <!--
      Link preview tags. %SITE_ORIGIN% is replaced at build time (see
      vite.config.ts): unfurlers such as WhatsApp ignore a relative og:image and
      show no thumbnail, so the image URL has to be absolute.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WagerLens" />
    <meta property="og:title" content="WagerLens | Your betting history, analyzed." />
    <meta
      property="og:description"
      content="Upload your Stake betting archives and see where the money went. Parsed entirely in your browser, nothing is uploaded."
    />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="WagerLens dashboard showing total wagered, net profit and loss, ROI and bet count."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WagerLens | Your betting history, analyzed." />
    <meta
      name="twitter:description"
      content="Upload your Stake betting archives and see where the money went. Parsed entirely in your browser, nothing is uploaded."
    />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' fill='none' stroke='%23f5f5f0' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23ff4f00' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // palette. Mirrors resolveInitialTheme() in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('wagerlens.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable, keep the markup default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
